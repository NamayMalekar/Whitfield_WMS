      Type pairing: Outfit for display (geometric, wide bowls - the Poppins family
      of shapes, but tighter and quieter at large sizes), Plus Jakarta Sans for
      interface copy (same geometric skeleton, humanist details that survive 13px
      under warehouse lighting), JetBrains Mono for counts and codes.
      Poppins stays in the stack as a fallback so the shapes never change much.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
